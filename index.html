<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CardQuest</title>
<style>

.tile{cursor:pointer}.tg{display:flex;gap:6px;margin-top:10px}.tg span{background:#fff3;border-radius:99px;padding:3px 10px;font-size:12px}

.cdi{width:240px;font-size:46px;text-align:center;letter-spacing:12px;text-transform:uppercase;border:4px solid #ffe14d;border-radius:18px;padding:10px 4px 10px 16px;color:#222}
.ct{display:inline-block;width:62px;height:78px;line-height:78px;margin:0 5px;background:#fff;color:#222;border-radius:14px;letter-spacing:0;animation:pop .5s both}

.pass .x{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));left:24px;width:60px;height:60px;border-radius:50%;background:#fff;color:#7d9bb0;font-size:28px;padding:0}
.okw{position:absolute;bottom:calc(50px + env(safe-area-inset-bottom,0px));background:#fff;border-radius:40px;padding:30px 50px}
.ok{background:#48ab5a;border-bottom:6px solid #39923f;border-radius:16px;width:240px;height:92px;font:900 38px system-ui}

:root{--f1:#1fa35f;--f2:#0b6b3a;--k1:#6d28d9;--k2:#a855f7}

.cd.sm{font-size:8px}
.cd.bk{background:radial-gradient(circle,#fff6 0 10%,transparent 11%),repeating-linear-gradient(45deg,var(--k1) 0 .5em,var(--k2) .5em 1em);border:.22em solid #fff;box-shadow:inset 0 0 0 .15em var(--k1),0 .2em .5em #0007}

.bks .cd{margin-left:-26px}

.mid{background:radial-gradient(ellipse at 50% 35%,var(--f1),var(--f2) 70%,#000a),repeating-radial-gradient(circle at 50% 50%,#ffffff09 0 2px,transparent 2px 6px);border:.45em solid #4a2c12;outline:.18em solid #d4af37;box-shadow:inset 0 0 70px #000b,0 20px 44px #000a}
.tile{position:relative;overflow:hidden;background:linear-gradient(160deg,#ffffff24,#ffffff08)}
.tile::before{content:'';position:absolute;inset:-50% auto -50% -60%;width:40%;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:skewX(-20deg);transition:.7s;pointer-events:none}.tile:hover::before{left:130%}
.tile i{filter:drop-shadow(0 6px 10px var(--c));font-size:54px}
.kg{grid-template-columns:repeat(3,76px)}.slot{width:70px;height:96px}
.clr-btn{width:46px;height:46px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 4px 10px #0006;transition:.15s}.clr-btn:hover{transform:scale(1.2)}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:#ffffff14;backdrop-filter:blur(10px);border:2px solid #ffffff33;border-radius:22px;padding:10px 14px;margin:0 auto 16px;max-width:600px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff3d71,#ffb020);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 14px #ff3d71}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.si{background:#ffffff1a;border-radius:14px;padding:10px;text-align:center;border:2px solid transparent}.si.on{border-color:#ffe14d}.si i{display:block;height:50px;border-radius:10px;margin-bottom:6px}

#tb{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#ffe14d,#ff3d71);color:#111;font:900 clamp(28px,7vw,50px) system-ui;padding:14px 38px;border-radius:99px;box-shadow:0 0 60px #ffe14dcc;z-index:100;pointer-events:none;opacity:0;transition:.35s cubic-bezier(.2,.9,.3,1.4)}#tb.show{transform:translate(-50%,-50%) scale(1);opacity:1}

html{background:#12062f}
body{animation:none!important;background:radial-gradient(circle at 20% 12%,#ff3d7144,transparent 45%),radial-gradient(circle at 88% 28%,#4dd2ff33,transparent 45%),radial-gradient(circle at 55% 92%,#a855f744,transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3))!important}

<script>
const S4=[[0,0],[2,0],[0,4],[2,4]],S6=[...S4,[0,2],[2,2]],S8=[...S4,[0,1.33],[2,1.33],[0,2.67],[2,2.67]],

udeck=()=>{let d=[];for(let c of 'rygb'){d.push(c+'0');for(let v of '123456789SRD')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('wW','wF');return sh(d)};
const L="A23456789TJQK",SU="♣♦♠♥",su=c=>c/13|0,red=c=>su(c)&1,srt=(a,b)=>a-b,hv=c=>c%13||13,
sh=a=>{for(let i=a.length;i--;){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},
deck=()=>sh([...Array(52).keys()]),
cd=(c,x='')=>{if(typeof c=='string'){let t=UT[c[1]]||c[1];return`<div class="cd uno ${c[0]=='w'?'uw':''} ${x}" style="--u:${UC[c[0]]}"><i class="ul">${t}</i><b class="uv">${t}</b></div>`}
let r=c%13,s=su(c),k=L[r].replace('T',10),pip=(px,py,f,z='')=>`<svg viewBox="0 0 24 24" class="${f?'fl':''} ${z}" style="left:${px*50}%;top:${py*25}%"><use href="#s${s}"/></svg>`,
b=r==0?pip(1,2,0,'bg'):r>9?`<div class="fc">${k}</div>`:PS[r+1].map(([px,py])=>pip(px,py,py>2)).join(''),u=`<svg viewBox="0 0 24 24"><use href="#s${s}"/></svg>`;

bk=n=>`<span class="bks">${'<div class="cd bk sm"></div>'.repeat(Math.min(n,13))}</span>`,
$=id=>document.getElementById(id);
function melds(h){let m=[];for(let r=0;r<13;r++){let g=h.filter(c=>c%13==r);if(g.length>2){m.push(g);if(g.length>3)g.forEach(x=>m.push(g.filter(y=>y!=x)))}}
for(let s=0;s<4;s++)for(let a=0;a<13;a++)for(let b=a+2;b<13;b++){let u=[];for(let r=a;r<=b;r++)u.push(s*13+r);if(u.every(c=>h.includes(c)))m.push(u)}return m}

let S,host=1,R=null,iv,T,cfv=-1,sel=0,kn=0,code='',nm='',pv=0,pw=0,ds=[],cat='All',q='',lv=-1,me=Math.random().toString(36).slice(2,8);
const G={
hearts:{n:4,name:'Hearts',ico:'♥️',col:'#ff3d71',p:'4 players',d:'Dodge hearts and the Queen of Spades. Lowest score wins!',
rules:['4 players, 13 cards each. Whoever holds the 2♣ must lead it.','Follow the suit that was led if you can; otherwise play anything. Highest card of the led suit wins the trick and leads next.','Every ♥ is worth 1 point and the Q♠ is worth 13. Lowest score after all 13 tricks wins.','You can’t lead a ♥ until a ♥ has been played (unless you hold only hearts).','Shoot the Moon: take all 26 points and everyone else gets 26 while you get 0!','Glowing cards are the ones you can legally play. (This version skips the 3-card pass.)'],

can:(S,p,c)=>G.hearts.legal(S,p).includes(c),pick:(S,c)=>({c}),

if(S.tr.length<4){S.turn=(p+1)%4;return}
let ls=su(S.tr[0].c),w=S.tr.filter(t=>su(t.c)==ls).sort((a,b)=>hv(b.c)-hv(a.c))[0].p;S.pt[w]+=S.tr.reduce((s,t)=>s+(su(t.c)==3)+(t.c==37?13:0),0);S.lt=S.tr;S.tr=[];S.turn=w;
if(!h.length){if(S.pt.includes(26))S.pt=S.pt.map(x=>x==26?0:26);let b=S.pt.indexOf(Math.min(...S.pt));S.over={t:`🏆 ${S.seats[b].name} wins! (${S.pt.join(' / ')})`}}},
bot(S,p){let l=[...G.hearts.legal(S,p)].sort((a,b)=>hv(a)-hv(b)),t=S.tr;if(t.length&&!l.some(c=>su(c)==su(t[0].c)))return{c:l.includes(37)?37:l.sort((a,b)=>(su(b)==3)-(su(a)==3)||hv(b)-hv(a))[0]};return{c:l[0]}},

hint:S=>`· Score ${S.pt.join(' / ')} ${S.hb?'· ♥ broken':''}`},
c8:{n:4,name:'Crazy Eights',ico:'8️⃣',col:'#ffb020',p:'2–4 players',d:'Match suit or rank. 8s are wild. Empty your hand first!',
rules:['Each player gets 5 cards. A starter card is turned face up.','On your turn play a card matching the top card’s suit or rank.','8s are wild: play one any time and the suit switches (this version auto-picks your most common suit).','Can’t or don’t want to play? Tap the draw pile to take a card, which ends your turn.','First player to empty their hand wins!'],
init(S){let d=deck(),t;S.h=S.seats.map(()=>d.splice(0,5).sort(srt));do{t=d.shift()}while(t%13==7&&d.push(t));S.dk=d;S.top=[t];S.su=su(t);S.turn=0},
legal(S,p){let t=S.top.at(-1);return S.h[p].filter(c=>c%13==7||su(c)==S.su||c%13==t%13)},

function buy(id){let x=[...TH,...BK].find(y=>y.id==id);if(W.coins<x.p)return toast('Not enough coins 🪙');W.coins-=x.p;W.own.push(id);eq(id)}
function eq(id){W[id[0]=='t'?'tt':'bb']=id;save();themeApply();snd('click');shop()}
