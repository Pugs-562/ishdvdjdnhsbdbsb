<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CardQuest Arcade</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg1:#2a0a6b;--bg2:#0a4a8b;--bg3:#8b0a6c;--tx:#fff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#12062f;--bg2:#06243f;--bg3:#3f063a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:800 16px system-ui,sans-serif;background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg3));background-size:300% 300%;animation:bg 14s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.f{position:fixed;bottom:-60px;opacity:.12;animation:fl linear infinite;pointer-events:none}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}
#cv{position:fixed;inset:0;pointer-events:none;z-index:60}
#a{max-width:960px;margin:auto;padding:16px;position:relative;z-index:10}
h1{font-size:clamp(36px,9vw,68px);margin:16px 0 0;text-align:center;letter-spacing:2px;text-shadow:0 0 24px #ff3d71}
h1 span{background:linear-gradient(90deg,#ffe14d,#ff3d71,#4dd2ff,#ffe14d);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:300%}}
.sub{text-align:center;opacity:.9;margin:6px 0 20px;font-size:18px;text-shadow:0 2px 8px #0008}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
input,select{padding:14px 18px;border-radius:14px;border:3px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font:800 16px system-ui;outline:none;transition:.2s}
input{width:180px}
input:focus,select:focus{border-color:#ffe14d;box-shadow:0 0 16px rgba(255,225,77,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tile{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:24px;padding:20px;border:3px solid var(--c);box-shadow:0 0 24px -4px var(--c);transition:.25s;animation:up .5s both}
.tile:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 0 42px 4px var(--c)}
.tile i{font-size:48px;font-style:normal;display:block;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.tile h3{margin:8px 0 4px;font-size:22px}.tile p{margin:6px 0;font-weight:600;opacity:.9;font-size:14px}.tile small{opacity:.75;font-size:13px}
.tile div{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:800 15px system-ui;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:#fff;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
button:hover{transform:scale(1.05);filter:brightness(1.15)}button:active{transform:scale(.95)}
.b{background:linear-gradient(135deg,#ff3d71,#ff9a3d)}.b2{background:linear-gradient(135deg,#00b3ff,#7a5cff)}.b3{background:rgba(255,255,255,.25)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;background:rgba(0,0,0,.25);padding:10px 16px;border-radius:16px;flex-wrap:wrap}
.code{background:#ffe14d;color:#111;padding:6px 14px;border-radius:99px;font-size:18px;font-weight:900;letter-spacing:1px}
.ctr{text-align:center;padding:30px 16px;background:rgba(0,0,0,.2);border-radius:28px;margin-top:10px}
.big{font-size:64px;letter-spacing:12px;text-shadow:0 0 24px #ffe14d;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);padding:10px 18px;border-radius:99px;margin:6px;animation:up .4s;font-size:16px}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.opp{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 16px;text-align:center;font-size:14px;min-width:130px;border:2px solid rgba(255,255,255,.1)}
.opp.on{animation:gl 1s infinite alternate;background:rgba(255,225,77,.3);border-color:#ffe14d}
@keyframes gl{to{box-shadow:0 0 24px 6px #ffe14d}}
.bks{display:inline-flex;margin-top:4px}.bks .cd{margin-left:-26px;animation:none}.bks .cd:first-child{margin-left:0}
.mid{min-height:210px;display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0;background:radial-gradient(#1fa35f,#0b6b3a);border-radius:28px;padding:16px;box-shadow:inset 0 0 40px #0008,0 0 30px #0a8}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.trick{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.trick div{text-align:center}.trick small{display:block;margin-top:4px;font-weight:700}
.msg{text-align:center;min-height:28px;margin:10px;font-size:18px;text-shadow:0 2px 6px #0008}

/* CARDS & HAND SWIPE ENHANCEMENTS */
.cd{width:56px;height:80px;border-radius:10px;background:#fff;color:#111;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.175,.885,.32,1.275),box-shadow .2s;animation:deal .3s both;user-select:none;flex:none;scroll-snap-align:center}
.cd b{font-size:26px;line-height:1}.cd.r{color:#e11d48}
@keyframes deal{from{transform:translateY(-20px) scale(.8);opacity:.2}}
.cd.pop{animation:pop .4s both}@keyframes pop{from{transform:scale(1.8) rotate(20deg);opacity:0}}
.cd.bk{background:repeating-linear-gradient(45deg,#6d28d9,#6d28d9 6px,#a855f7 6px,#a855f7 12px);color:transparent;border:3px solid #fff}
.sm{width:38px;height:54px;font-size:14px}.sm b{font-size:17px}

.hand-wrap{position:relative;width:100%;padding:10px 0}
.hand{display:flex;justify-content:flex-start;padding:24px 36px 14px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(to right,transparent 0%,black 5%,black 95%,transparent 100%)}
.hand .cd{margin-left:-22px;cursor:pointer}.hand .cd:first-child{margin-left:0}
.cd.ok{box-shadow:0 0 16px 4px #ffe14d;transform:translateY(-6px)}
.hand .cd.ok:hover,.cd.up{transform:translateY(-24px) scale(1.08);z-index:20}
.cd.dim{filter:brightness(.65);opacity:.8}

/* TURN BANNER ANIMATION */
#turn-banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#ffe14d,#ff3d71);color:#111;font-size:clamp(28px,6vw,48px);font-weight:900;padding:16px 40px;border-radius:99px;box-shadow:0 0 50px rgba(255,225,77,.8);z-index:100;pointer-events:none;opacity:0;transition:all .35s cubic-bezier(.175,.885,.32,1.275);letter-spacing:2px;text-align:center}
#turn-banner.show{transform:translate(-50%,-50%) scale(1);opacity:1;animation:pulseTurn .8s ease-in-out infinite alternate}
@keyframes pulseTurn{to{box-shadow:0 0 70px #4dd2ff;transform:translate(-50%,-50%) scale(1.08)}}

.kg{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-items:center}
.slot{width:68px;height:90px;border:3px dashed rgba(255,255,255,.6);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;background:rgba(0,0,0,.15);transition:.2s}
.slot:hover{background:rgba(255,255,255,.2)}
.slot.cn{border-color:#ffe14d}.slot.sl{box-shadow:0 0 20px 6px #4dd2ff;border-color:#4dd2ff}
.slot i{position:absolute;right:-8px;top:-10px;background:#ff3d71;border-radius:99px;font-size:12px;padding:2px 7px;font-style:normal;font-weight:900}
.slot em{opacity:.6;font-style:normal;font-size:30px}
.ctrd{text-align:center;font-size:14px;font-weight:700}.ctrd button{padding:8px 12px;font-size:13px;margin-top:6px}
.sui{font-size:48px;background:#fff;border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;color:#111;animation:bob 2s infinite;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;animation:up .4s}
.ov h1{font-size:clamp(30px,7vw,52px)}
#m .md{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.c2{background:linear-gradient(160deg,#3b1b8f,#16466e);border-radius:24px;padding:24px;max-width:560px;max-height:88vh;overflow:auto;animation:pop .35s both;box-shadow:0 0 50px #4dd2ff;border:3px solid rgba(255,255,255,.2)}
.c2 li{margin:10px 0;font-weight:600;line-height:1.5;font-size:15px}

/* KINGS IN THE CORNER PILE DRAWER */
.pile-preview{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px;background:rgba(0,0,0,.4);border-radius:18px;margin-top:10px}
</style>
</head>
<body>
<div id="turn-banner">YOUR TURN!</div>
<div id="a"></div><div id="m"></div><canvas id="cv"></canvas>
<script>
// --- AUDIO SYNTHESIZER ---
let soundEnabled = true;
const snd = {
  ctx: null,
  init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(type) {
    if(!soundEnabled) return;
    try {
      this.init();
      let c = this.ctx, o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      let t = c.currentTime;
      if(type=='click') { o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(800, t+0.05); g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0.01, t+0.05); o.start(t); o.stop(t+0.05); }
      else if(type=='deal') { o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(600, t+0.08); g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0.01, t+0.08); o.start(t); o.stop(t+0.08); }
      else if(type=='turn') { o.frequency.setValueAtTime(523.25, t); o.frequency.exponentialRampToValueAtTime(880, t+0.15); g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0.01, t+0.15); o.start(t); o.stop(t+0.15); }
      else if(type=='win') { 
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          let ot = c.createOscillator(), gt = c.createGain();
          ot.connect(gt); gt.connect(c.destination);
          ot.frequency.setValueAtTime(f, t + i*0.1);
          gt.gain.setValueAtTime(0.2, t + i*0.1);
          gt.gain.linearRampToValueAtTime(0.01, t + i*0.1 + 0.3);
          ot.start(t + i*0.1); ot.stop(t + i*0.1 + 0.3);
        });
      }
    } catch(e){}
  }
};

const L="A23456789TJQK", SU="♣♦♠♥", su=c=>c/13|0, red=c=>su(c)&1, srt=(a,b)=>a-b, hv=c=>c%13||13,
sh=a=>{for(let i=a.length;i--;){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},
deck=()=>sh([...Array(52).keys()]),
cd=(c,x='',a)=>`<div class="cd ${red(c)?'r':''} ${x}" ${a}>${L[c%13].replace('T',10)}<b>${SU[su(c)]}</b></div>`,
bk=n=>`<span class="bks">${'<div class="cd bk sm"></div>'.repeat(Math.min(n,13))}</span>`,
$=id=>document.getElementById(id);

function melds(h){let m=[];for(let r=0;r<13;r++){let g=h.filter(c=>c%13==r);if(g.length>2){m.push(g);if(g.length>3)g.forEach(x=>m.push(g.filter(y=>y!=x)))}}
for(let s=0;s<4;s++)for(let a=0;a<13;a++)for(let b=a+2;b<13;b++){let u=[];for(let r=a;r<=b;r++)u.push(s*13+r);if(u.every(c=>h.includes(c)))m.push(u)}return m}
const dw=h=>{let b=h.reduce((t,c)=>t+Math.min(c%13+1,10),0);for(let m of melds(h))b=Math.min(b,dw(h.filter(c=>!m.includes(c))));return b};

let S, host=1, R=null, iv, T, cfv=-1, sel=0, kn=0, code='', nm='', me=Math.random().toString(36).slice(2,8);
let botDiff = 'medium'; // easy, medium, hard
let maxPlayersOpt = 4;
let autofillBots = true;
let lastTurnPlayer = -1;

// --- GAMES DEFINITION ---
const G={
hearts:{n:4,maxN:4,name:'Hearts',ico:'♥️',col:'#ff3d71',p:'2–4 players',d:'Dodge hearts and the Queen of Spades. Lowest score wins!',
rules:['2–4 players. Whoever holds the 2♣ must lead it.','Follow suit if possible. Highest card of led suit wins trick.','Every ♥ = 1 pt, Q♠ = 13 pts. Lowest score wins!','Shoot the Moon: take all 26 pts to give everyone else 26!'],
init(S){let d=deck(), cpr=Math.floor(52/S.seats.length);S.h=S.seats.map((_,i)=>d.slice(i*cpr,(i+1)*cpr).sort(srt));S.tr=[];S.lt=[];S.pt=S.seats.map(()=>0);S.hb=0;S.first=1;let starter=S.h.findIndex(h=>h.includes(1));S.turn=starter>=0?starter:0},
legal(S,p){let h=S.h[p],t=S.tr;if(t.length){let f=h.filter(c=>su(c)==su(t[0].c));return f.length?f:h}if(S.first&&h.includes(1))return[1];let n=h.filter(c=>su(c)!=3);return S.hb||!n.length?h:n},
can:(S,p,c)=>G.hearts.legal(S,p).includes(c),pick:(S,c)=>({c}),
apply(S,p,m){if(!G.hearts.legal(S,p).includes(m.c))return false;let h=S.h[p];h.splice(h.indexOf(m.c),1);S.tr.push({p,c:m.c});S.first=0;if(su(m.c)==3)S.hb=1;snd.play('deal');
if(S.tr.length<S.seats.length){S.turn=(p+1)%S.seats.length;return}
let ls=su(S.tr[0].c),w=S.tr.filter(t=>su(t.c)==ls).sort((a,b)=>hv(b.c)-hv(a.c))[0].p;S.pt[w]+=S.tr.reduce((s,t)=>s+(su(t.c)==3)+(t.c==37?13:0),0);S.lt=S.tr;S.tr=[];S.turn=w;
if(!h.length){if(S.pt.includes(26))S.pt=S.pt.map(x=>x==26?0:26);let b=S.pt.indexOf(Math.min(...S.pt));S.over={t:`🏆 ${S.seats[b].name} wins! (${S.pt.join(' / ')})`};snd.play('win')}},
bot(S,p){let l=[...G.hearts.legal(S,p)];
if(botDiff=='easy') return {c:l[Math.floor(Math.random()*l.length)]};
l.sort((a,b)=>hv(a)-hv(b));let t=S.tr;
if(t.length&&!l.some(c=>su(c)==su(t[0].c)))return{c:l.includes(37)?37:l.sort((a,b)=>(su(b)==3)-(su(a)==3)||hv(b)-hv(a))[0]};return{c:botDiff=='hard'?l[0]:l[Math.floor(l.length/2)]||l[0]}},
ui:S=>`<div class="trick">${S.tr.map(t=>`<div>${cd(t.c,'pop')}<small>${S.seats[t.p].name}</small></div>`).join('')||'<span style="opacity:.8">Last trick: '+(S.lt.map(t=>SU[su(t.c)]+L[t.c%13]).join(' ')||'—')+'</span>'}</div>`,
hint:S=>`· Scores: ${S.seats.map((s,i)=>s.name+': '+S.pt[i]).join(' | ')} ${S.hb?'· ♥ broken':''}`},

c8:{n:4,maxN:4,name:'Crazy Eights',ico:'8️⃣',col:'#ffb020',p:'2–4 players',d:'Match suit or rank. 8s are wild. Empty your hand first!',
rules:['Each player gets 5 cards. Top card face up.','Match top card suit/rank. 8s can change the active suit.','Can’t play? Tap the draw pile to draw a card and end your turn.'],
init(S){let d=deck(),t;S.h=S.seats.map(()=>d.splice(0,5).sort(srt));do{t=d.shift()}while(t%13==7&&d.push(t));S.dk=d;S.top=[t];S.su=su(t);S.turn=0},
legal(S,p){let t=S.top.at(-1);return S.h[p].filter(c=>c%13==7||su(c)==S.su||c%13==t%13)},
can:(S,p,c)=>G.c8.legal(S,p).includes(c),pick:(S,c)=>({c}),tap:(S,k)=>({d:1}),
apply(S,p,m){let h=S.h[p],n=S.seats.length;if(m.d){if(!S.dk.length&&S.top.length>1)S.dk=sh(S.top.splice(0,S.top.length-1));if(S.dk.length)h.push(S.dk.shift());h.sort(srt);S.turn=(p+1)%n;snd.play('deal');return}
if(!G.c8.legal(S,p).includes(m.c))return false;h.splice(h.indexOf(m.c),1);S.top.push(m.c);S.su=su(m.c);snd.play('deal');
if(m.c%13==7){let k=[0,0,0,0];h.forEach(c=>k[su(c)]++);S.su=k.indexOf(Math.max(...k))}
if(!h.length){S.over={t:`🏆 ${S.seats[p].name} wins!`};snd.play('win');return}S.turn=(p+1)%n},
bot(S,p){let l=G.c8.legal(S,p);if(!l.length)return{d:1};
if(botDiff=='easy')return{c:l[Math.floor(Math.random()*l.length)]};
return{c:l.find(c=>c%13!=7)??l[0]}},
ui:S=>`<div class="row"><div onclick="Q('d')" style="cursor:pointer;text-align:center"><div class="cd bk"></div><small style="display:block;margin-top:4px;font-weight:700">${S.dk.length} cards</small></div>${cd(S.top.at(-1),'pop')}<div class="sui">${SU[S.su]}</div></div>`,
hint:(S,my,mi)=>my&&!G.c8.legal(S,mi).length?'· No play: tap the draw pile':''},

kic:{n:4,maxN:4,name:'Kings in the Corner',ico:'👑',col:'#a855f7',p:'2–4 players',d:'Build alternating-color piles. Only Kings claim corners!',
rules:['Build downward alternating colors (red 6 on black 7).','Corner spots starting with ♚ are only for Kings!','Tap any pile to view all cards inside that pile!'],
init(S){let d=deck();S.h=S.seats.map(()=>d.splice(0,7).sort(srt));S.pl=[[],[],[],[],[],[],[],[]];[0,1,2,3].forEach(i=>S.pl[i].push(d.shift()));S.dk=d;S.turn=0;S.viewPile=-1;G.kic.draw(S)},
draw(S){if(S.dk.length)S.h[S.turn].push(S.dk.shift());S.h[S.turn].sort(srt)},
ok(S,c,i){let t=S.pl[i].at(-1);return t==null?(i<4||c%13==12):(red(c)!=red(t)&&c%13==t%13-1)},
can:()=>1,pick:(S,c)=>{sel={t:'h',c};snd.play('click');render()},
tap(S,i){
  if(i=='e'){sel=0;S.viewPile=-1;snd.play('click');return{e:1}}
  if(typeof i === 'number') S.viewPile = i;
  if(sel){
    let m=sel.t=='h'?{c:sel.c,to:i}:sel.i!=i?{a:sel.i,b:i}:0;sel=0;
    if(m){snd.play('deal');return m}render();return
  }
  if(S.pl[i].length){sel={t:'p',i};snd.play('click');render()}
},
apply(S,p,m){let h=S.h[p],K=G.kic;if(m.e){S.turn=(p+1)%S.seats.length;K.draw(S);return}
if(m.c!=null){if(!h.includes(m.c)||!K.ok(S,m.c,m.to))return false;h.splice(h.indexOf(m.c),1);S.pl[m.to].push(m.c);if(!h.length){S.over={t:`👑 ${S.seats[p].name} wins!`};snd.play('win')};return}
let A=S.pl[m.a];if(m.a==m.b||!A||!A.length||!K.ok(S,A[0],m.b))return false;S.pl[m.b].push(...A);S.pl[m.a]=[]},
bot(S,p){let h=S.h[p],K=G.kic;for(let c of h.filter(c=>c%13==12))for(let i=4;i<8;i++)if(K.ok(S,c,i))return{c,to:i};
for(let c of h)for(let i=0;i<8;i++)if(S.pl[i].length&&K.ok(S,c,i))return{c,to:i};
for(let a=0;a<8;a++)for(let b=0;b<8;b++)if(a!=b&&S.pl[a].length&&S.pl[b].length&&K.ok(S,S.pl[a][0],b))return{a,b};
let e=[0,1,2,3].find(i=>!S.pl[i].length);if(e!=null&&h.length>1)return{c:h.reduce((a,b)=>b%13>a%13?b:a),to:e};return{e:1}},
ui:S=>`<div class="kg">${[4,0,5,3,-1,1,6,2,7].map(i=>i<0?`<div class="ctrd">📚 ${S.dk.length}<br><button class="b" onclick="Q('e')">End Turn</button></div>`:`<div class="slot ${i>3?'cn':''}${sel&&sel.t=='p'&&sel.i==i?'sl':''}" onclick="Q(${i})">${S.pl[i].length?cd(S.pl[i].at(-1))+`<i>${S.pl[i].length}</i>`:'<em>'+(i>3?'♚':'')+'</em>'}</div>`).join('')}</div>` +
(S.viewPile>=0 && S.pl[S.viewPile] && S.pl[S.viewPile].length ? `<div style="text-align:center;margin-top:10px;font-size:13px;opacity:.9">Cards in pile #${S.viewPile+1}:</div><div class="pile-preview">${S.pl[S.viewPile].map(c=>cd(c,'sm')).join('')}</div>` : ''),
hint:()=>'· Tap card → pile (or tap pile to view contents)'},

gin:{n:2,maxN:2,name:'Gin Rummy',ico:'🃏',col:'#22d3a0',p:'2 players',d:'Make sets and runs, then knock with low deadwood.',
rules:['Sets (same rank) & Runs (same suit seq).','Knock when deadwood ≤ 10.'],
init(S){let d=deck();S.h=[d.splice(0,10).sort(srt),d.splice(0,10).sort(srt)];S.up=[d.shift()];S.dk=d;S.turn=0;S.ph=0},
can:S=>S.ph==1,pick:(S,c)=>({x:c,k:kn?1:0}),
tap:(S,k)=>S.ph?0:{d:k},
apply(S,p,m){let h=S.h[p];if(m.d){if(S.ph)return false;let c=m.d=='u'?S.up.pop():S.dk.shift();if(c==null)return false;h.push(c);h.sort(srt);S.ph=1;snd.play('deal');return}
if(!S.ph||!h.includes(m.x))return false;if(m.k&&dw(h.filter(c=>c!=m.x))>10)return false;h.splice(h.indexOf(m.x),1);S.up.push(m.x);snd.play('deal');
if(m.k){let o=S.h[1-p],a=dw(h),b=dw(o),w=p,pts=b-a+(a?0:25);if(a>=b){w=1-p;pts=a-b+25}S.over={t:`${S.seats[w].name} wins ${pts} pts${w==p?(a?'!':' with GIN!'):' by UNDERCUT!'} (deadwood ${a} vs ${b})`};snd.play('win');return}
if(S.dk.length<3){S.over={t:'Stock ran out: draw game!'};return}S.ph=0;S.turn=1-p},
bot(S,p){let h=S.h[p];if(!S.ph){let u=S.up.at(-1),H=[...h,u],b=Math.min(...H.map(x=>dw(H.filter(y=>y!=x))));return{d:b<dw(h)?'u':'s'}}
let b=h.map(x=>[dw(h.filter(y=>y!=x)),x]).sort((a,b)=>a[0]-b[0])[0];return{x:b[1],k:b[0]<=7?1:0}},
ui:S=>`<div class="row"><div onclick="Q('s')" style="cursor:pointer;text-align:center"><div class="cd bk"></div><small style="display:block;margin-top:4px;font-weight:700">${S.dk.length}</small></div><div onclick="Q('u')" style="cursor:pointer">${cd(S.up.at(-1),'ok')}</div><button class="${kn?'b':'b3'}" onclick="kn=!kn;snd.play('click');render()">${kn?'🔔 Knock armed':'🔔 Knock'}</button></div>`,
hint:(S,my,mi)=>`· ${my?(S.ph?'Discard a card':'Draw: stock or discard'):''} · Deadwood ${dw(S.h[mi])}`}
};

// --- PEERJS MULTIPLAYER ---
let peer = null, connObj = null, connections = {};

function initPeerHost(code, cb) {
  if(peer) peer.destroy();
  peer = new Peer('cq-game-2026-' + code, { host: '0.peerjs.com', port: 443, secure: true });
  peer.on('open', () => { if(cb) cb(true); });
  peer.on('connection', c => {
    connections[c.peer] = c;
    c.on('data', data => handleNetMessage(data));
    c.on('close', () => delete connections[c.peer]);
  });
}

function initPeerGuest(code, onConnected) {
  if(peer) peer.destroy();
  peer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true });
  peer.on('open', () => {
    connObj = peer.connect('cq-game-2026-' + code, { reliable: true });
    if(connObj) {
      connObj.on('open', () => { if(onConnected) onConnected(); });
      connObj.on('data', data => handleNetMessage(data));
    }
  });
  peer.on('error', err => { alert('Room not found or host left.'); leaveRoom(); });
}

function handleNetMessage(m) {
  if(!m || m.code !== code) return;
  if(host) {
    let maxN = S ? (S.maxPlayers || G[S.g].n) : 4;
    if(m.t=='join' && S && S.phase=='lobby' && !S.seats.some(s=>s.id==m.id) && S.seats.length < maxN) {
      S.seats.push({name:String(m.name).slice(0,12), id:m.id});
      broadcastState(); render();
    }
    if(m.t=='a') {
      let p = S.seats.findIndex(s=>s.id==m.id);
      if(p>=0) doMove(p, m.m);
    }
  } else {
    if(m.t=='S') { S = m.S; render(); }
  }
}

function broadcastState() {
  if(!host) return;
  let msg = {code, t:'S', S};
  Object.values(connections).forEach(c => { try{ c.send(msg); }catch(e){} });
}

function sendAction(m) {
  let msg = {code, t:'a', id:me, m};
  if(host) handleNetMessage(msg);
  else if(connObj && connObj.open) connObj.send(msg);
}

// --- UI CONTROLS ---
const menu=()=>`<h1>CARD<span>QUEST</span></h1><p class="sub">⚡ Blooket-Style Cross-Play Card Arcade ⚡</p>
<div class="bar">
  <input placeholder="Your name" value="${nm}" oninput="nm=this.value">
  <input id="cd" maxlength="4" placeholder="ROOM CODE" style="text-transform:uppercase">
  <button class="b2" onclick="joinRoom()">🔑 Join Room</button>
</div>
<div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap">
  <select onchange="botDifficulty(this.value)">
    <option value="easy" ${botDiff=='easy'?'selected':''}>🤖 Bot Difficulty: Easy</option>
    <option value="medium" ${botDiff=='medium'?'selected':''}>🤖 Bot Difficulty: Medium</option>
    <option value="hard" ${botDiff=='hard'?'selected':''}>🤖 Bot Difficulty: Hard</option>
  </select>
  <button class="b3" onclick="soundEnabled=!soundEnabled;this.textContent=soundEnabled?'🔊 Sound: ON':'🔇 Sound: OFF';snd.play('click')">🔊 Sound: ON</button>
</div>
<div class="grid">${Object.entries(G).map(([k,g],i)=>`<div class="tile" style="--c:${g.col};animation-delay:${i*.1}s"><i>${g.ico}</i><h3>${g.name}</h3><p>${g.d}</p><small>${g.p}</small><div><button class="b" onclick="playBots('${k}')">🤖 Play Solo/Bots</button><button class="b2" onclick="hostRoom('${k}')">🌐 Host Room</button><button class="b3" onclick="guide('${k}')">📖 Guide</button></div></div>`).join('')}</div>`;

function botDifficulty(val){ botDiff = val; }

function guide(k){let g=G[k];snd.play('click');$('m').innerHTML=`<div class="md" onclick="if(event.target==this)$('m').innerHTML=''"><div class="c2"><h2>${g.ico} How to play ${g.name}</h2><ul>${g.rules.map(r=>`<li>${r}</li>`).join('')}</ul><button class="b" onclick="$('m').innerHTML='';snd.play('click')">Got it!</button></div></div>`}

function fill(){
  if(!autofillBots) return;
  let target = S.maxPlayers || G[S.g].n;
  while(S.seats.length < target) S.seats.push({name:'🤖 Bot '+S.seats.length, bot:1});
}

function playBots(k){
  snd.play('click');
  S={g:k,phase:'play',v:0,maxPlayers:maxPlayersOpt,autofill:true,seats:[{name:nm||'You',id:me}]};
  host=1; autofillBots=true; fill(); G[k].init(S); render(); tick();
}

async function hostRoom(k){
  snd.play('click');
  code=[...Array(4)].map(_=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  host=1; 
  S={g:k,phase:'lobby',v:0,maxPlayers:G[k].maxN,autofill:false,seats:[{name:nm||'Host',id:me}]};
  render();
  initPeerHost(code, () => render());
}

async function joinRoom(){
  let c=$('cd').value.toUpperCase().trim();
  if(c.length<4)return alert('Enter a valid 4-letter room code');
  snd.play('click');
  code=c; host=0; S=null;
  render();

  initPeerGuest(code, () => {
    connObj.send({code, t:'join', id:me, name:nm||'Guest'});
  });

  clearInterval(iv);
  iv=setInterval(()=>{
    if(!S || !S.seats.some(s=>s.id==me)) {
      if(connObj && connObj.open) connObj.send({code, t:'join', id:me, name:nm||'Guest'});
    }
  }, 1500);
}

function startGame(){
  snd.play('click');
  autofillBots = S.autofill;
  fill(); G[S.g].init(S); S.phase='play'; S.v++; broadcastState(); render(); tick();
}

function playAgain(){
  snd.play('click');
  G[S.g].init(S); S.over=0; S.v++; broadcastState(); render(); tick();
}

function leaveRoom(){
  snd.play('click');
  clearTimeout(T); clearInterval(iv);
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=null; connObj=null; connections={};
  S=null; host=1; sel=0; code=''; render();
}

function triggerTurnBanner(text) {
  let b = $('turn-banner');
  b.textContent = text;
  b.classList.add('show');
  snd.play('turn');
  setTimeout(() => b.classList.remove('show'), 900);
}

function doMove(p,m){
  let g=G[S.g];
  if(S.over || S.turn!=p || g.apply(S,p,m)===false) return;
  S.v++; broadcastState(); render(); tick();
}

function tick(){
  clearTimeout(T);
  if(S && S.phase=='play' && !S.over) {
    if(S.turn !== lastTurnPlayer) {
      lastTurnPlayer = S.turn;
      let mi = myi();
      triggerTurnBanner(S.turn === mi ? '✨ YOUR TURN!' : `👉 ${S.seats[S.turn].name}'s Turn`);
    }
    if(host && S.seats[S.turn] && S.seats[S.turn].bot) {
      T=setTimeout(()=>doMove(S.turn, G[S.g].bot(S,S.turn)), S.g=='kic'?650:900);
    }
  }
}

function mv(mi,m){kn=0; sendAction(m); render()}
const myi=()=>S.seats.findIndex(s=>s.id==me);

function P(c){
  let mi=myi(), g=G[S.g];
  if(S.turn!=mi || S.over || !g.can(S,mi,c)) return;
  let m=g.pick(S,c); if(m) mv(mi,m);
}

function Q(k){
  let mi=myi();
  if(S.turn!=mi || S.over) return;
  let t=G[S.g].tap; if(!t) return;
  let m=t(S,k); if(m) mv(mi,m);
}

function view(){
  let g=G[S.g], mi=myi(), top=`<div class="top"><b>${g.ico} ${g.name}</b><span class="code">ROOM ${code}</span><span><button class="b3" onclick="guide('${S.g}')">📖</button> <button class="b3" onclick="leaveRoom()">✖</button></span></div>`;
  
  if(S.phase=='lobby') {
    return top+`<div class="ctr">
      <h2>Waiting for players…</h2>
      <div class="big">${code}</div>
      <p>Share this room code with friends!</p>
      ${S.seats.map(s=>`<div class="chip">👤 ${s.name}</div>`).join('')}
      ${host?`
        <div style="margin:20px 0;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap">
          <label>Max Players: 
            <select onchange="S.maxPlayers=parseInt(this.value);broadcastState();render()">
              ${[2,3,4].map(n=>`<option value="${n}" ${S.maxPlayers==n?'selected':''}>${n} Players</option>`).join('')}
            </select>
          </label>
          <label style="cursor:pointer">
            <input type="checkbox" ${S.autofill?'checked':''} onchange="S.autofill=this.checked;broadcastState();render()"> Auto-fill empty slots with bots
          </label>
        </div>
        <button class="b" onclick="startGame()">▶ Start Game</button>
      `:'<p style="margin-top:16px">Waiting for host to start…</p>'}
    </div>`;
  }
  
  if(mi<0) return top+'<div class="ctr"><h2>Spectating game in progress...</h2></div>';
  let my=S.turn==mi&&!S.over, n=S.seats.length, ord=[...Array(n-1)].map((_,i)=>(mi+1+i)%n);
  
  return top+`<div class="opps">${ord.map(i=>`<div class="opp ${S.turn==i&&!S.over?'on':''}"><b>${S.seats[i].name}</b>${S.pt?` · ${S.pt[i]} pts`:''}<br>${S.over?S.h[i].map(c=>cd(c,'sm')).join(''):bk(S.h[i].length)}</div>`).join('')}</div>
  <div class="mid">${g.ui(S)}</div>
  <div class="msg">${S.over?'':my?'✨ Your turn! ':S.seats[S.turn].name+' is thinking… '}${g.hint(S,my,mi)}</div>
  <div class="hand-wrap"><div class="hand">${S.h[mi].map(c=>cd(c,(my&&g.can(S,mi,c)?'ok':my?'':'dim')+(sel&&sel.c==c?' up':''),`onclick="P(${c})"`)).join('')}</div></div>
  ${S.over?`<div class="ov"><h1>${S.over.t}</h1>${host?'<button class="b" onclick="playAgain()">↻ Play Again</button>':'<p>Waiting for host…</p>'}<button class="b3" onclick="leaveRoom()">Main Menu</button></div>`:''}`;
}

function render(){
  let a=$('a');
  if(!S){a.innerHTML=code?`<div class="ctr"><h2>Connecting to room ${code}…</h2><button class="b3" onclick="leaveRoom()">Cancel</button></div>`:menu();return}
  a.innerHTML=view();
  if(S.over && cfv!=S.v){cfv=S.v; confetti();}
}

function confetti(){
  let c=$('cv'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  let p=[...Array(180)].map(_=>({x:innerWidth/2, y:innerHeight/2, vx:(Math.random()-.5)*22, vy:Math.random()*-18-4, c:`hsl(${Math.random()*360},95%,60%)`, s:Math.random()*9+4})), f=0;
  (function l(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.35;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s)});if(f++<170)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height);})();
}

document.body.insertAdjacentHTML('beforeend',[...Array(18)].map((_,i)=>`<span class="f" style="left:${i*5.6}%;animation-duration:${9+i%7*3}s;animation-delay:-${i*2}s;font-size:${24+i%5*12}px">${SU[i%4]}</span>`).join(''));
render();
</script>
</body>
