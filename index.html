<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CardQuest Arcade</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg1:#1d023a;--bg2:#071e3d;--bg3:#2c002e;--tx:#fff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0c011a;--bg2:#030d1a;--bg3:#140015}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;color:var(--tx);font:800 16px system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-size:300% 300%;animation:bg 14s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.f{position:fixed;bottom:-60px;opacity:.12;animation:fl linear infinite;pointer-events:none;z-index:1}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}
#cv{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60;background:transparent}
#a{max-width:1000px;margin:auto;padding:16px;position:relative;z-index:10}
h1{font-size:clamp(36px,9vw,68px);margin:16px 0 0;text-align:center;letter-spacing:2px;text-shadow:0 0 24px #ff3d71}
h1 span{background:linear-gradient(90deg,#ffe14d,#ff3d71,#4dd2ff,#ffe14d);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:300%}}
.sub{text-align:center;opacity:.9;margin:6px 0 20px;font-size:18px;text-shadow:0 2px 8px #0008}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
input,select{padding:14px 18px;border-radius:14px;border:3px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;font:800 16px system-ui;outline:none;transition:.2s}
input{width:180px}
input:focus,select:focus{border-color:#ffe14d;box-shadow:0 0 16px rgba(255,225,77,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tile{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border-radius:24px;padding:20px;border:3px solid var(--c);box-shadow:0 0 24px -4px var(--c);transition:.25s;animation:up .5s both}
.tile:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 0 42px 4px var(--c)}
.tile svg{width:48px;height:48px;display:block;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.tile h3{margin:8px 0 4px;font-size:22px}.tile p{margin:6px 0;font-weight:600;opacity:.9;font-size:14px}.tile small{opacity:.75;font-size:13px}
.tile div{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:800 15px system-ui;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:#fff;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
button:hover{transform:scale(1.05);filter:brightness(1.15)}button:active{transform:scale(.95)}
.b{background:linear-gradient(135deg,#ff3d71,#ff9a3d)}.b2{background:linear-gradient(135deg,#00b3ff,#7a5cff)}.b3{background:rgba(255,255,255,.25)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;background:rgba(0,0,0,.35);padding:10px 16px;border-radius:16px;flex-wrap:wrap}
.code{background:#ffe14d;color:#111;padding:6px 14px;border-radius:99px;font-size:18px;font-weight:900;letter-spacing:1px}
.ctr{text-align:center;padding:30px 16px;background:rgba(0,0,0,.3);border-radius:28px;margin-top:10px}
.big{font-size:64px;letter-spacing:12px;text-shadow:0 0 24px #ffe14d;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);padding:10px 18px;border-radius:99px;margin:6px;animation:up .4s;font-size:16px}
.opps{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.opp{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 16px;text-align:center;font-size:14px;min-width:130px;border:2px solid rgba(255,255,255,.1)}
.opp.on{animation:gl 1s infinite alternate;background:rgba(255,225,77,.3);border-color:#ffe14d}
@keyframes gl{to{box-shadow:0 0 24px 6px #ffe14d}}
.bks{display:inline-flex;margin-top:4px}.bks .cd{margin-left:-26px;animation:none}.bks .cd:first-child{margin-left:0}
.mid{position:relative;min-height:220px;display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0;background:radial-gradient(#1fa35f,#0b6b3a);border-radius:28px;padding:20px;box-shadow:inset 0 0 40px #0008,0 0 30px #0a8;border:4px solid rgba(255,255,255,.15)}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.trick{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.trick div{text-align:center}.trick small{display:block;margin-top:4px;font-weight:700}
.msg{text-align:center;min-height:28px;margin:10px;font-size:18px;text-shadow:0 2px 6px #0008}

/* DEALER ANIMATION */
.shuffler{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#ffe14d;color:#111;padding:4px 16px;border-radius:99px;font-weight:900;font-size:12px;box-shadow:0 4px 12px #0008;z-index:20;display:flex;align-items:center;gap:6px}
.shuffler-arm{width:12px;height:12px;background:#ff3d71;border-radius:50%;display:inline-block;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.4)}}

/* CARTOONY CARDS */
.cd{width:60px;height:86px;border-radius:12px;background:#fff;color:#111;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:900;box-shadow:0 5px 0 #bbb,0 8px 16px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.175,.885,.32,1.275),box-shadow .2s;animation:deal .35s both;user-select:none;flex:none;cursor:pointer;border:3px solid #111;position:relative}
.cd:hover{transform:translateY(-6px) scale(1.05)}
.cd svg{width:24px;height:24px;margin-top:2px}
.cd b{font-size:22px;line-height:1}
.cd.r{color:#e11d48}
/* UNO CARDS */
.cd.u-r{background:#ff3d71;color:#fff;border-color:#fff}.cd.u-y{background:#ffe14d;color:#111;border-color:#fff}.cd.u-g{background:#22c55e;color:#fff;border-color:#fff}.cd.u-b{background:#00b3ff;color:#fff;border-color:#fff}.cd.u-w{background:linear-gradient(135deg,#ff3d71,#ffe14d,#22c55e,#00b3ff);color:#fff;border-color:#fff}
@keyframes deal{from{transform:translateY(-30px) scale(.7) rotate(-10deg);opacity:.1}}
.cd.pop{animation:pop .4s both}@keyframes pop{from{transform:scale(1.8) rotate(20deg);opacity:0}}
.cd.bk{background:repeating-linear-gradient(45deg,#6d28d9,#6d28d9 8px,#a855f7 8px,#a855f7 16px);color:transparent;border:3px solid #fff}
.sm{width:38px;height:54px;font-size:12px;border-width:2px;box-shadow:0 3px 0 #999,0 5px 8px rgba(0,0,0,.3)}.sm svg{width:14px;height:14px}.sm b{font-size:15px}

.hand-wrap{position:relative;width:100%;padding:10px 0}
.hand{display:flex;justify-content:flex-start;padding:24px 36px 14px;overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.hand .cd{margin-left:-18px}.hand .cd:first-child{margin-left:0}
.cd.ok{box-shadow:0 0 16px 5px #ffe14d,0 5px 0 #bbb;transform:translateY(-6px)}
.cd.ok:hover,.cd.up{transform:translateY(-24px) scale(1.1) rotate(2deg);z-index:20}
.cd.dim{filter:brightness(.6);opacity:.75}

/* TURN BANNER */
#turn-banner{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#ffe14d,#ff3d71);color:#111;font-size:clamp(28px,6vw,48px);font-weight:900;padding:16px 40px;border-radius:99px;box-shadow:0 0 60px rgba(255,225,77,.9);z-index:100;pointer-events:none;opacity:0;transition:all .35s cubic-bezier(.175,.885,.32,1.275);letter-spacing:2px;text-align:center}
#turn-banner.show{transform:translate(-50%,-50%) scale(1);opacity:1;animation:pulseTurn .8s ease-in-out infinite alternate}
@keyframes pulseTurn{to{box-shadow:0 0 80px #4dd2ff;transform:translate(-50%,-50%) scale(1.08)}}

/* KINGS IN THE CORNER 3x3 GRID */
.kg{display:grid;grid-template-columns:repeat(3,76px);gap:10px;justify-items:center}
.slot{width:72px;height:96px;border:3px dashed rgba(255,255,255,.6);border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;background:rgba(0,0,0,.25);transition:.2s}
.slot:hover{background:rgba(255,255,255,.2)}
.slot.cn{border-color:#ffe14d;background:rgba(255,225,77,.12)}
.slot.sl{box-shadow:0 0 20px 6px #4dd2ff;border-color:#4dd2ff;background:rgba(77,210,255,.25)}
.slot i{position:absolute;right:-6px;top:-8px;background:#ff3d71;border-radius:99px;font-size:11px;padding:2px 6px;font-style:normal;font-weight:900;box-shadow:0 2px 6px #0008}
.slot em{opacity:.6;font-style:normal;font-size:30px}
.ctrd{text-align:center;font-size:13px;font-weight:700}.ctrd button{padding:8px 12px;font-size:12px;margin-top:4px}
.sui{font-size:32px;background:#fff;border-radius:50%;width:68px;height:68px;display:flex;align-items:center;justify-content:center;color:#111;animation:bob 2s infinite;box-shadow:0 4px 16px rgba(0,0,0,.3);border:3px solid #111}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;animation:up .4s}
.ov h1{font-size:clamp(30px,7vw,52px)}
#m .md{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.c2{background:linear-gradient(160deg,#3b1b8f,#16466e);border-radius:24px;padding:26px;max-width:620px;max-height:88vh;overflow:auto;animation:pop .35s both;box-shadow:0 0 50px #4dd2ff;border:3px solid rgba(255,255,255,.2)}
.c2 li{margin:10px 0;font-weight:600;line-height:1.5;font-size:15px}
.pile-preview{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px;background:rgba(0,0,0,.4);border-radius:18px;margin-top:10px}
.clr-picker{display:flex;gap:12px;justify-content:center;margin-top:12px}
.clr-btn{width:44px;height:44px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 4px 10px #0006;transition:.15s}
.clr-btn:hover{transform:scale(1.15)}
</style>
</head>
<body>
<div id="turn-banner">YOUR TURN!</div>
<div id="a"></div><div id="m"></div><canvas id="cv"></canvas>
<script>
// --- AUDIO SYNTHESIZER ---
let soundEnabled = true;
const snd = {
  ctx: null,
  init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  play(type) {
    if(!soundEnabled) return;
    try {
      this.init();
      let c = this.ctx, o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      let t = c.currentTime;
      if(type=='click') { o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(800, t+0.05); g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0.01, t+0.05); o.start(t); o.stop(t+0.05); }
      else if(type=='deal') { o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(600, t+0.08); g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0.01, t+0.08); o.start(t); o.stop(t+0.08); }
      else if(type=='turn') { o.frequency.setValueAtTime(523.25, t); o.frequency.exponentialRampToValueAtTime(880, t+0.15); g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0.01, t+0.15); o.start(t); o.stop(t+0.15); }
      else if(type=='win') { 
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          let ot = c.createOscillator(), gt = c.createGain();
          ot.connect(gt); gt.connect(c.destination);
          ot.frequency.setValueAtTime(f, t + i*0.1);
          gt.gain.setValueAtTime(0.2, t + i*0.1);
          gt.gain.linearRampToValueAtTime(0.01, t + i*0.1 + 0.3);
          ot.start(t + i*0.1); ot.stop(t + i*0.1 + 0.3);
        });
      }
    } catch(e){}
  }
};

const L="A23456789TJQK", 
svgs = [
  '<svg viewBox="0 0 24 24" fill="#111"><path d="M12 2C9 2 7 4 7 7c0 2 1.5 3.5 3 4.5C8.5 13 7 14.5 7 17c0 2.5 2 4.5 5 4.5s5-2 5-4.5c0-2.5-1.5-4-3-5.5 1.5-1 3-2.5 3-4.5 0-3-2-5-5-5z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="#e11d48"><path d="M12 2L2 12l10 10 10-10L12 2z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="#111"><path d="M12 2C8 2 5 5 5 9c0 3 2 5.5 5 6.5L9 22h6l-1-6.5c3-1 5-3.5 5-6.5 0-4-3-7-7-7z"/></svg>',
  '<svg viewBox="0 0 24 24" fill="#e11d48"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
];
const su=c=>c/13|0, red=c=>su(c)&1, srt=(a,b)=>a-b, hv=c=>c%13||13,
sh=a=>{for(let i=a.length;i--;){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},
deck=()=>sh([...Array(52).keys()]),
cd=(c,x='',a)=>{
  if(typeof c==='object'&&c.u){
    const colMap={r:'u-r',y:'u-y',g:'u-g',b:'u-b',w:'u-w'};
    return `<div class="cd ${colMap[c.c]||'u-w'} ${x}" onclick="handleCardClick(${encodeURIComponent(JSON.stringify(c))})" ${a}>${c.v}<b>${c.c=='w'?'🌈':'⚡'}</b></div>`;
  }
  return `<div class="cd ${red(c)?'r':''} ${x}" onclick="handleCardClick(${c})" ${a}>${L[c%13].replace('T',10)}${svgs[su(c)]}</div>`;
},
bk=n=>`<span class="bks">${'<div class="cd bk sm"></div>'.repeat(Math.min(n,13))}</span>`,
$=id=>document.getElementById(id);

function melds(h){let m=[];for(let r=0;r<13;r++){let g=h.filter(c=>c%13==r);if(g.length>2){m.push(g);if(g.length>3)g.forEach(x=>m.push(g.filter(y=>y!=x)))}}
for(let s=0;s<4;s++)for(let a=0;a<13;a++)for(let b=a+2;b<13;b++){let u=[];for(let r=a;r<=b;r++)u.push(s*13+r);if(u.every(c=>h.includes(c)))m.push(u)}return m}
const dw=h=>{let b=h.reduce((t,c)=>t+Math.min(c%13+1,10),0);for(let m of melds(h))b=Math.min(b,dw(h.filter(c=>!m.includes(c))));return b};

let S, host=1, iv, T, cfv=-1, sel=0, kn=0, code='', nm='', me=Math.random().toString(36).slice(2,8);
let botDiff = 'medium';
let maxPlayersOpt = 4;
let autofillBots = true;
let lastTurnPlayer = -1;

// --- UNO DECK ---
function createUnoDeck() {
  let dk = [], colors = ['r','y','g','b'];
  colors.forEach(c => {
    dk.push({u:1, c, v:'0'});
    for(let i=1;i<=9;i++){ dk.push({u:1, c, v:String(i)}); dk.push({u:1, c, v:String(i)}); }
    ['🚫','🔄','+2'].forEach(v => { dk.push({u:1, c, v}); dk.push({u:1, c, v}); });
  });
  for(let i=0;i<4;i++){ dk.push({u:1, c:'w', v:'🌈'}); dk.push({u:1, c:'w', v:'+4'}); }
  return sh(dk);
}

// --- POKER EVALUATOR ---
function evalPokerHand(cards) {
  let ranks = cards.map(c=>c%13).sort((a,b)=>b-a);
  let suits = cards.map(c=>su(c));
  let isFlush = suits.every(s=>s===suits[0]);
  let isStraight = false;
  let uniqueRanks = [...new Set(ranks)];
  if(uniqueRanks.length >= 5) {
    for(let i=0; i<=uniqueRanks.length-5; i++) {
      if(uniqueRanks[i] - uniqueRanks[i+4] === 4) isStraight = true;
    }
    if(!isStraight && uniqueRanks.includes(12) && uniqueRanks.includes(3) && uniqueRanks.includes(2) && uniqueRanks.includes(1) && uniqueRanks.includes(0)) isStraight = true;
  }
  let counts = {}; ranks.forEach(r=>counts[r]=(counts[r]||0)+1);
  let freq = Object.values(counts).sort((a,b)=>b-a);
  if(isFlush && isStraight) return {score:8, name:'Straight Flush'};
  if(freq[0]===4) return {score:7, name:'Four of a Kind'};
  if(freq[0]===3 && freq[1]===2) return {score:6, name:'Full House'};
  if(isFlush) return {score:5, name:'Flush'};
  if(isStraight) return {score:4, name:'Straight'};
  if(freq[0]===3) return {score:3, name:'Three of a Kind'};
  if(freq[0]===2 && freq[1]===2) return {score:2, name:'Two Pair'};
  if(freq[0]===2) return {score:1, name:'One Pair'};
  return {score:0, name:'High Card'};
}

// --- GAMES DEFINITION ---
const G={
uno:{n:4,maxN:4,name:'UNO',ico:`<svg viewBox="0 0 24 24" fill="#ff3d71"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>`,col:'#ff3d71',p:'2–4 players',d:'Match color or action. Play Skip, Reverse, Draw 2 & Wild +4!',
rules:[
  '<strong>Goal:</strong> Be the first player to shed all cards in your hand.',
  '<strong>Matching:</strong> Tap any card matching the current color, number, or symbol on top of the pile.',
  '<strong>Action Cards:</strong> 🚫 Skip, 🔄 Reverse, +2 Draw Two.',
  '<strong>Wild Cards:</strong> 🌈 Wild picks new color. 🌈+4 draws 4 for next player and skips them.',
  '<strong>Drawing:</strong> Tap the Draw Pile if you have no valid cards.'
],
init(S){
  let d=createUnoDeck();
  S.h=S.seats.map(()=>d.splice(0,7));
  let top = d.shift();
  while(top.c=='w') { d.push(top); top = d.shift(); }
  S.dk=d; S.top=[top]; S.curClr=top.c; S.dir=1; S.turn=0; S.pendingClr=false;
},
legal(S,p){
  let top = S.top.at(-1);
  return S.h[p].filter(c => c.c=='w' || c.c==S.curClr || c.v==top.v);
},
can:(S,p,c)=>{
  let card = typeof c==='string'?JSON.parse(c):c;
  let top = S.top.at(-1);
  return card.c=='w' || card.c==S.curClr || card.v==top.v;
},
pick:(S,c)=>{
  let card = typeof c==='string'?JSON.parse(c):c;
  return {c:card};
},
tap:(S,k)=>({d:1}),
apply(S,p,m){
  let h=S.h[p], n=S.seats.length;
  if(m.d){
    if(!S.dk.length) S.dk = createUnoDeck();
    h.push(S.dk.shift());
    S.turn=(S.turn+S.dir+n)%n;
    snd.play('deal'); return;
  }
  if(m.clrSelect) {
    S.curClr = m.clrSelect; S.pendingClr = false;
    S.turn = (S.turn + S.dir + n) % n;
    return;
  }
  let idx = h.findIndex(x => x.c==m.c.c && x.v==m.c.v);
  if(idx<0) return false;
  h.splice(idx,1); S.top.push(m.c); snd.play('deal');
  if(!h.length){ S.over={t:`🏆 ${S.seats[p].name} wins UNO!`}; snd.play('win'); return; }
  
  if(m.c.c=='w') {
    S.pendingClr = true;
    if(m.c.v=='+4') {
      let nextP = (S.turn + S.dir + n) % n;
      for(let i=0;i<4;i++) S.h[nextP].push(S.dk.shift()||createUnoDeck()[0]);
      S.turn = (S.turn + S.dir) % n;
    }
    return;
  }
  S.curClr = m.c.c;
  if(m.c.v=='🚫') S.turn = (S.turn + S.dir) % n;
  else if(m.c.v=='🔄') S.dir *= -1;
  else if(m.c.v=='+2') {
    let nextP = (S.turn + S.dir + n) % n;
    for(let i=0;i<2;i++) S.h[nextP].push(S.dk.shift()||createUnoDeck()[0]);
    S.turn = (S.turn + S.dir) % n;
  }
  S.turn = (S.turn + S.dir + n) % n;
},
bot(S,p){
  if(S.pendingClr) return {clrSelect:['r','y','g','b'][Math.random()*4|0]};
  let l=G.uno.legal(S,p); if(!l.length)return{d:1};
  let pick = l.find(c=>c.c!='w')||l[0];
  let res = {c:pick};
  if(pick.c=='w') res.clrSelect = ['r','y','g','b'][Math.random()*4|0];
  return res;
},
ui:S=>`<div class="row">
  <div onclick="Q('d')" style="cursor:pointer;text-align:center">
    <div class="cd bk"></div>
    <small style="display:block;margin-top:4px;font-weight:700">${S.dk.length} cards</small>
  </div>

apply(S,p,m){
  if(S.folded[p]) return false;

  else if(m.act=='call') { let diff = S.curBet - S.bets[p]; S.bets[p]+=diff; S.pot+=diff; }
  else if(m.act=='raise') { let r=S.curBet+10, diff=r-S.bets[p]; S.bets[p]+=diff; S.pot+=diff; S.curBet=r; }
  snd.play('deal');
  let active = S.seats.map((_,i)=>i).filter(i=>!S.folded[i]);
  if(active.length===1) { S.over={t:`🏆 ${S.seats[active[0]].name} wins pot $${S.pot}!`}; snd.play('win'); return; }
  let next = (p+1)%S.seats.length;

    }

// --- PEERJS MULTIPLAYER ---
let peer = null, connObj = null, connections = {};

function initPeerHost(code, cb) {
  if(peer) peer.destroy();
  peer = new Peer('cq-game-2026-' + code, { host: '0.peerjs.com', port: 443, secure: true });
  peer.on('open', () => { if(cb) cb(true); });
  peer.on('connection', c => {
    connections[c.peer] = c;
    c.on('data', data => handleNetMessage(data));
    c.on('close', () => delete connections[c.peer]);
  });
}

function initPeerGuest(code, onConnected) {
  if(peer) peer.destroy();
  peer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true });
  peer.on('open', () => {
    connObj = peer.connect('cq-game-2026-' + code, { reliable: true });
    if(connObj) {
      connObj.on('open', () => { if(onConnected) onConnected(); });
      connObj.on('data', data => handleNetMessage(data));
    }
  });
  peer.on('error', err => { alert('Room not found or host left.'); leaveRoom(); });
}

function handleNetMessage(m) {
  if(!m || m.code !== code) return;
  if(host) {
    let maxN = S ? (S.maxPlayers || G[S.g].n) : 4;
    if(m.t=='join' && S && S.phase=='lobby' && !S.seats.some(s=>s.id==m.id) && S.seats.length < maxN) {
      S.seats.push({name:String(m.name).slice(0,12), id:m.id});
      broadcastState(); render();
    }
    if(m.t=='a') {
      let p = S.seats.findIndex(s=>s.id==m.id);
      if(p>=0) doMove(p, m.m);
    }
  } else {
    if(m.t=='S') { S = m.S; render(); }
  }
}

function broadcastState() {
  if(!host) return;
  let msg = {code, t:'S', S};
  Object.values(connections).forEach(c => { try{ c.send(msg); }catch(e){} });
}

function sendAction(m) {
  let msg = {code, t:'a', id:me, m};
  if(host) handleNetMessage(msg);
  else if(connObj && connObj.open) connObj.send(msg);
}

  let target = S.maxPlayers || G[S.g].n;

  host=1; autofillBots=true; fill(); G[k].init(S); render(); tick();

async function hostRoom(k){
  snd.play('click');
  code=[...Array(4)].map(_=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  host=1; 
  S={g:k,phase:'lobby',v:0,maxPlayers:G[k].maxN,autofill:false,seats:[{name:nm||'Host',id:me}]};
  render();
  initPeerHost(code, () => render());
}

async function joinRoom(){
  let c=$('cd').value.toUpperCase().trim();
  if(c.length<4)return alert('Enter a valid 4-letter room code');
  snd.play('click');
  code=c; host=0; S=null;
  render();

  initPeerGuest(code, () => {
    connObj.send({code, t:'join', id:me, name:nm||'Guest'});
  });

  clearInterval(iv);
  iv=setInterval(()=>{
    if(!S || !S.seats.some(s=>s.id==me)) {
      if(connObj && connObj.open) connObj.send({code, t:'join', id:me, name:nm||'Guest'});
    }
  }, 1500);
}

function startGame(){
  snd.play('click');
  autofillBots = S.autofill;
  fill(); G[S.g].init(S); S.phase='play'; S.v++; broadcastState(); render(); tick();
}

function playAgain(){
  snd.play('click');
  G[S.g].init(S); S.over=0; S.v++; broadcastState(); render(); tick();
}

function leaveRoom(){
  snd.play('click');
  clearTimeout(T); clearInterval(iv);
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=null; connObj=null; connections={};
  S=null; host=1; sel=0; code=''; render();
}

function triggerTurnBanner(text) {
  let b = $('turn-banner');
  b.textContent = text;
  b.classList.add('show');
  snd.play('turn');
  setTimeout(() => b.classList.remove('show'), 900);
}

function doMove(p,m){
  let g=G[S.g];
  if(S.over || S.turn!=p || g.apply(S,p,m)===false) return;
  S.v++; broadcastState(); render(); tick();
}

function tick(){
  clearTimeout(T);
  if(S && S.phase=='play' && !S.over) {
    if(S.turn !== lastTurnPlayer) {
      lastTurnPlayer = S.turn;
      let mi = myi();
      triggerTurnBanner(S.turn === mi ? '✨ YOUR TURN!' : `👉 ${S.seats[S.turn].name}'s Turn`);
    }
    if(host && S.seats[S.turn] && S.seats[S.turn].bot) {
      T=setTimeout(()=>doMove(S.turn, G[S.g].bot(S,S.turn)), S.g=='kic'?650:900);
    }
  }
}

function mv(mi,m){kn=0; sendAction(m); render()}
const myi=()=>S.seats.findIndex(s=>s.id==me);

function handleCardClick(c){
  let mi=myi(), g=G[S.g];
  if(S.turn!=mi || S.over) return;
  if(typeof c === 'string' && c.startsWith('card:')) c = JSON.parse(c.split('card:')[1]);
  if(g.can(S,mi,c)) {
    let m = g.pick(S,c);
    if(m) mv(mi,m);
  } else {
    snd.play('click');
  }
}

function P(c){
  let mi=myi(), g=G[S.g];
  if(S.turn!=mi || S.over || !g.can(S,mi,c)) return;
  let m=g.pick(S,c); if(m) mv(mi,m);
}

function Q(k){
  let mi=myi();
  if(S.turn!=mi || S.over) return;
  let t=G[S.g].tap; if(!t) return;
  let m=t(S,k); if(m) mv(mi,m);
}

function view(){
  let g=G[S.g], mi=myi(), top=`<div class="top"><b>${g.name}</b><span class="code">ROOM ${code}</span><span><button class="b3" onclick="guide('${S.g}')">📖</button> <button class="b3" onclick="leaveRoom()">✖</button></span></div>`;
  
  if(S.phase=='lobby') {
    return top+`<div class="ctr">
      <h2>Waiting for players…</h2>
      <div class="big">${code}</div>
      <p>Share this room code with friends!</p>
      ${S.seats.map(s=>`<div class="chip">👤 ${s.name}</div>`).join('')}
      ${host?`
        <div style="margin:20px 0;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap">
          <label>Max Players: 
            <select onchange="S.maxPlayers=parseInt(this.value);broadcastState();render()">
              ${[2,3,4].map(n=>`<option value="${n}" ${S.maxPlayers==n?'selected':''}>${n} Players</option>`).join('')}
            </select>
          </label>
          <label style="cursor:pointer">
            <input type="checkbox" ${S.autofill?'checked':''} onchange="S.autofill=this.checked;broadcastState();render()"> Auto-fill empty slots with bots
          </label>
        </div>
        <button class="b" onclick="startGame()">▶ Start Game</button>
      `:'<p style="margin-top:16px">Waiting for host to start…</p>'}
    </div>`;
  }
  
  if(mi<0) return top+'<div class="ctr"><h2>Spectating game in progress...</h2></div>';
  let my=S.turn==mi&&!S.over, n=S.seats.length, ord=[...Array(n-1)].map((_,i)=>(mi+1+i)%n);
  
  return top+`<div class="opps">${ord.map(i=>`<div class="opp ${S.turn==i&&!S.over?'on':''}"><b>${S.seats[i].name}</b>${S.pt?` · ${S.pt[i]} pts`:''}<br>${S.over?S.h[i].map(c=>cd(c,'sm')).join(''):bk(S.h[i].length)}</div>`).join('')}</div>
  <div class="mid">
    <div class="shuffler"><span class="shuffler-arm"></span> Dealer Dealing to: ${S.seats[S.turn]?S.seats[S.turn].name:'Table'}</div>
    ${g.ui(S)}
  </div>
  <div class="msg">${S.over?'':my?'✨ Your turn! ':S.seats[S.turn].name+' is thinking… '}${g.hint(S,my,mi)}</div>
  <div class="hand-wrap"><div class="hand">${S.h[mi].map(c=>cd(c,(my&&g.can(S,mi,c)?'ok':my?'':'dim')+(sel&&sel.c==c?' up':'')).replace('onclick="', 'onclick="handleCardClick('+(typeof c==='object'?JSON.stringify(c):c)+');')).join('')}</div></div>
  ${S.over?`<div class="ov"><h1>${S.over.t}</h1>${host?'<button class="b" onclick="playAgain()">↻ Play Again</button>':'<p>Waiting for host…</p>'}<button class="b3" onclick="leaveRoom()">Main Menu</button></div>`:''}`;
}

function render(){
  let a=$('a');
  if(!S){a.innerHTML=code?`<div class="ctr"><h2>Connecting to room ${code}…</h2><button class="b3" onclick="leaveRoom()">Cancel</button></div>`:menu();return}
  a.innerHTML=view();
  if(S.over && cfv!=S.v){cfv=S.v; confetti();}
}

function confetti(){
  let c=$('cv'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  let p=[...Array(200)].map(_=>({x:innerWidth/2, y:innerHeight/2, vx:(Math.random()-.5)*26, vy:Math.random()*-20-4, c:`hsl(${Math.random()*360},95%,60%)`, s:Math.random()*10+5, r:Math.random()*360, vr:(Math.random()-.5)*15})), f=0;
  (function l(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.4;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r*Math.PI/180);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/2,q.s,q.s*0.6);x.restore()});if(f++<180)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height);})();
}

document.body.insertAdjacentHTML('beforeend',[...Array(18)].map((_,i)=>`<span class="f" style="left:${i*5.6}%;animation-duration:${9+i%7*3}s;animation-delay:-${i*2}s;font-size:${24+i%5*12}px">♠</span>`).join(''));
render();
</script>
</body>
</html>
